{{ define "title" }}{{ .Site.Title }}{{ end }}

{{ define "main" }}

  <div class="jumbotron-custom py-5">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-3 mb-3 mb-md-0">
          <img src="{{ .Params.hero_image | relURL }}"
               class="img-fluid rounded"
               alt="{{ .Params.hero_image_alt }}">
        </div>
        <div class="col-md-9 text-white">
          <h1>{{ .Params.hero_title }}</h1>
          <p class="lead">{{ .Params.hero_subtitle }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="container mt-5 mb-5">
    <div class="row">

      <div class="col-md-8">
        <h2>{{ .Params.progress_heading }}</h2>

        <ul>
          {{ range .Params.progress_items }}
          <li>
            <strong>{{ .title }}</strong> {{ .text }}
          </li>
          {{ end }}
        </ul>

        {{ .Content }}
      </div>

      <div class="col-md-4 pt-md-5">
        <img src="{{ .Params.campaign_photo | relURL }}" class="img-fluid" alt="{{ .Params.campaign_photo_alt }}">
      </div>

    </div>
  </div>

{{ end }}
